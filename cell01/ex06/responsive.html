<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
</head>
<body>

<table width="100%" style="min-height: 200px; border-collapse: collapse;">
    <tr>
        <td style="
            background-color: lightgreen;
            text-align: center;
            vertical-align: middle;
            padding: 20px;
        ">
            First cell
        </td>
        <td style="
            background-color: peachpuff;
            text-align: center;
            vertical-align: middle;
            padding: 20px;
        ">
            Second cell
        </td>
    </tr>
</table>

</body>
</html>
